<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>halo_api benchmarks</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar" aria-label="Benchmark options">
        <label for="benchmark">Benchmark</label>
        <select id="benchmark"><option value="film_parse">Film parsing</option></select>
        <label for="fixture">Film</label>
        <select id="fixture"><option value="all">All films</option></select>
      </aside>
      <section class="content" aria-labelledby="chart-title">
        <div class="chart-header">
          <h1 id="chart-title">Film parsing</h1>
          <div class="legend"><span><i class="dot halo"></i>halo_api</span><span><i class="dot shell"></i>libfilmshell</span></div>
        </div>
        <div id="chart" class="chart" aria-live="polite"><p>Loading results…</p></div>
        <div class="chart-footer">
          <p>Median parse-to-return time. Each film is scaled to its slower parser. Shorter bars are faster.</p>
          <p id="provenance"></p>
        </div>
      </section>
    </main>
  </body>
</html>
