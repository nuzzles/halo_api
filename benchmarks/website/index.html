<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#242424">
    <title>Film parsing benchmarks · halo_api</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar" aria-label="Benchmark settings">
        <section class="setting" aria-labelledby="dataset-heading">
          <h2 id="dataset-heading">Dataset</h2>
          <span id="cpu-model" class="choice" aria-label="Measured processor">Loading…</span>
        </section>
        <section class="setting" aria-labelledby="threading-heading">
          <h2 id="threading-heading">Threading</h2>
          <span id="threading" class="choice">Loading…</span>
        </section>
        <section class="setting" aria-labelledby="benchmark-heading">
          <h2 id="benchmark-heading">Select Benchmark</h2>
          <span class="choice">Film Parsing</span>
        </section>
        <section class="setting" aria-labelledby="metric-heading">
          <h2 id="metric-heading">Metric</h2>
          <span class="choice">Time</span>
        </section>
      </aside>
      <section class="content" aria-labelledby="chart-title">
        <header class="chart-header">
          <h1 id="chart-title">Film parsing time</h1>
          <div class="legend" aria-label="Parsers">
            <span><i class="swatch halo" aria-hidden="true"></i>halo_api</span>
            <span><i class="swatch shell" aria-hidden="true"></i>libfilmshell</span>
          </div>
        </header>
        <div id="chart" class="chart" aria-live="polite"><p>Loading results…</p></div>
        <footer class="chart-footer">
          <p>Median parse time · Each pair is scaled to its slower parser · Lower is better</p>
          <p id="updated"></p>
        </footer>
      </section>
    </main>
  </body>
</html>
