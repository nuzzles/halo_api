[package]
name = "film-decode-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
halo_api = { path = "../.." }
filmshell = { git = "https://github.com/OpenSpartan/libfilmshell", rev = "031e2179f0758314e2a97fb96438c7b1e82ce1fb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 3
debug = 1
