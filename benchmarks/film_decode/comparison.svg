<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Initial whole-film decode speed</title>
<desc id="desc">Each bar is libfilmshell milliseconds divided by halo_api milliseconds. Values above one mean halo_api is faster; the dashed line marks a 25 percent lead.</desc>
<rect width="960" height="100%" fill="#ffffff"/>
<text x="24" y="31" font-family="sans-serif" font-size="19" font-weight="bold" fill="#172b4d">Initial whole-film decode speed</text>
<text x="24" y="55" font-family="sans-serif" font-size="13" fill="#42526e">Higher is faster for halo_api · 1.0× is equal time · 1.33× is the 25% lead</text>
<line x1="461.1" x2="461.1" y1="75" y2="577" stroke="#dfe5ec" stroke-width="1"/>
<text x="461.1" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42526e">0.5×</text>
<line x1="622.2" x2="622.2" y1="75" y2="577" stroke="#51657a" stroke-width="2"/>
<text x="622.2" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42526e">1×</text>
<line x1="729.6" x2="729.6" y1="75" y2="577" stroke="#16804a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="729.6" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42526e">1.33×</text>
<text x="24" y="96" font-family="sans-serif" font-size="13" fill="#172b4d">Bazaar idle</text>
<rect x="300" y="84" width="237.2" height="17" rx="3" fill="#b76519"/>
