name: Benchmark site

on:
  push:
    branches: [main]
    paths:
      - benchmarks/website/**
      - .github/workflows/benchmarks-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test benchmark views and datasets
        run: node --test benchmarks/website/app.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: benchmarks/website
      - id: deployment
        uses: actions/deploy-pages@v4
